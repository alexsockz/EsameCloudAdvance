# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: hpl-test
---
# ConfigMap for MPI hostfile
apiVersion: v1
kind: ConfigMap
metadata:
  name: mpi-hostfile
  namespace: hpl-test
data:
  hostfile: |
    hpl-worker-0.hpl-cluster.hpl-test.svc.cluster.local slots=1
    hpl-worker-1.hpl-cluster.hpl-test.svc.cluster.local slots=1
    hpl-worker-2.hpl-cluster.hpl-test.svc.cluster.local slots=1
    hpl-worker-3.hpl-cluster.hpl-test.svc.cluster.local slots=1
---
# Headless Service for stable DNS names
apiVersion: v1
kind: Service
metadata:
  name: hpl-cluster
  namespace: hpl-test
spec:
  clusterIP: None
  selector:
    app: hpl
    role: worker
  ports:
    - port: 22
      name: ssh
---
# StatefulSet for HPL workers with SSH
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hpl-worker
  namespace: hpl-test
spec:
  serviceName: hpl-cluster
  replicas: 4
  # Start all workers at once (default OrderedReady waits for each pod in turn)
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: hpl
      role: worker
  template:
    metadata:
      labels:
        app: hpl
        role: worker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hpl
              role: worker
      containers:
        - name: hpl
          image: alessiovalle/esame_img:1
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Setting up SSH for MPI communication..."

              # mpi user: '*' = no password, but NOT locked (a '!' locked account can't log in)
              useradd --create-home --shell /bin/bash mpi 2>/dev/null || true
              usermod -p '*' mpi

              mkdir -p /home/mpi/.ssh /run/sshd
              cat /run/mpi-ssh/id_rsa.pub > /home/mpi/.ssh/authorized_keys
              chown -R mpi:mpi /home/mpi/.ssh
              chmod 700 /home/mpi/.ssh
              chmod 600 /home/mpi/.ssh/authorized_keys
              chmod 777 /data

              cat > /home/mpi/.ssh/config <<EOF
              Host *
                StrictHostKeyChecking no
                UserKnownHostsFile=/dev/null
                LogLevel ERROR
              EOF
              chown mpi:mpi /home/mpi/.ssh/config
              chmod 600 /home/mpi/.ssh/config

              # sshd: first value of a keyword wins, so edit instead of appending
              ssh-keygen -A
              sed -i -E 's/^#?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
              sed -i -E 's/^#?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
              sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
              # pam_loginuid cannot write /proc/self/loginuid in a container and kills the session
              sed -i -E 's/^(session\s+)required(\s+pam_loginuid.so)/\1optional\2/' /etc/pam.d/sshd

              /usr/sbin/sshd -t || { echo "sshd_config INVALID"; sleep 3600; }

              echo "Worker $(hostname) starting sshd"
              # Foreground sshd = PID 1: logs go to 'kubectl logs', crash is visible
              exec /usr/sbin/sshd -D -e
          ports:
            - containerPort: 22
              name: ssh
          # Pod only becomes a DNS endpoint once sshd really listens on :22
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - SYS_CHROOT
                - AUDIT_WRITE
          volumeMounts:
          - name: hpccinf-config
            mountPath: /data/hpccinf.txt
            subPath: hpccinf.txt
          - name: mpi-ssh-key
            mountPath: /run/mpi-ssh
            readOnly: true
      volumes:
        - name: hpccinf-config
          configMap:
            name: hpccinf-config
        - name: mpi-ssh-key
          secret:
            secretName: mpi-ssh-key
            defaultMode: 0400
---
# Job to run the HPL benchmark
apiVersion: batch/v1
kind: Job
metadata:
  name: hpl-master
  namespace: hpl-test
spec:
  backoffLimit: 0   # fail fast so the log of the first failure is kept
  template:
    metadata:
      labels:
        app: hpl
        role: master
    spec:
      restartPolicy: Never
      containers:
        - name: hpl-runner
          image: alessiovalle/esame_img:1
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== HPL Benchmark Master ==="
              mkdir -p /root/.ssh
              cp /run/mpi-ssh/id_rsa /root/.ssh/id_rsa
              chmod 600 /root/.ssh/id_rsa
              cat > /root/.ssh/config <<EOF
              Host *
                StrictHostKeyChecking no
                UserKnownHostsFile=/dev/null
                LogLevel ERROR
              EOF
              chmod 600 /root/.ssh/config

              SSH_OPTS="-i /root/.ssh/id_rsa -l mpi -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no"
              NWORKERS=$(awk 'END { print NR }' /etc/mpi/hostfile)

              echo "Waiting for workers (DNS + SSH)..."
              for (( i=0; i<NWORKERS; i++ )); do
                WORKER="hpl-worker-${i}.hpl-cluster.hpl-test.svc.cluster.local"
                OK=0
                for retry in {1..60}; do
                  # keep stderr: this is where the real reason shows up
                  OUT=$(ssh ${SSH_OPTS} "${WORKER}" hostname 2>&1) && { OK=1; break; }
                  echo "[${WORKER}] retry ${retry}/60 -> ${OUT}"
                  getent hosts "${WORKER}" >/dev/null || echo "   (DNS does not resolve yet)"
                  sleep 3
                done
                if [ "$OK" -ne 1 ]; then
                  echo "ERROR: ${WORKER} not reachable. Verbose SSH output:"
                  ssh -v ${SSH_OPTS} "${WORKER}" hostname 2>&1 | tail -30
                  exit 1
                fi
                echo "✓ ${WORKER} reachable (remote hostname: ${OUT})"
              done

              echo ""
              echo "=== Running HPL Benchmark ==="
              cd /data
              cat /etc/mpi/hostfile
              set -o pipefail
              cat hpccinf.txt
              mpirun --allow-run-as-root \
              -np 4 \
              --hostfile /etc/mpi/hostfile \
              --mca orte_keep_fqdn_hostnames 1 \
              --mca plm_rsh_agent ssh \
              --mca plm_rsh_args "-i /root/.ssh/id_rsa -l mpi -o BatchMode=yes -o StrictHostKeyChecking=no" \
              --mca btl_tcp_if_include eth0 \
              --mca oob_tcp_if_include eth0 \
              --mca routed direct \
              --mca orte_base_help_aggregate 0 \
              --tag-output \
              hpcc 2>&1 | tee benchmark_output.txt
              EXIT_CODE=$?

              echo ""
              echo "=== Benchmark Complete (exit code: ${EXIT_CODE}) ==="

              # Rank 0 runs on worker-0, so hpccoutf.txt is written THERE, not in this pod
              echo "=== Results (hpccoutf.txt from hpl-worker-0) ==="
              ssh ${SSH_OPTS} hpl-worker-0.hpl-cluster.hpl-test.svc.cluster.local "cat /data/hpccoutf.txt" \
                || echo "ERROR: could not fetch hpccoutf.txt from hpl-worker-0"

              exit ${EXIT_CODE}
          volumeMounts:
            - name: hpccinf-config
              mountPath: /data/hpccinf.txt
              subPath: hpccinf.txt
            - name: mpi-hostfile
              mountPath: /etc/mpi/hostfile
              subPath: hostfile
            - name: mpi-ssh-key
              mountPath: /run/mpi-ssh
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            capabilities:
              add:
                - NET_RAW
      volumes:
        - name: hpccinf-config
          configMap:
            name: hpccinf-config
        - name: mpi-hostfile
          configMap:
            name: mpi-hostfile
        - name: mpi-ssh-key
          secret:
            secretName: mpi-ssh-key
            defaultMode: 0400
